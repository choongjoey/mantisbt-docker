# Vendored upstream plugin trees under plugins/ are kept pristine (byte-for-byte
# upstream@SHA), so the fixers must not rewrite them. Our repo-owned
# FieldDescriptions plugin and the generated VENDOR.md stay checked.
exclude: '^plugins/(?!FieldDescriptions/|VENDOR\.md$)'

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: check-yaml
  - id: end-of-file-fixer
  - id: trailing-whitespace
    exclude: \.patch$
  - id: check-case-conflict
  # Useful, but so far is broken on Windows
#  - id: check-executables-have-shebangs
  - id: check-merge-conflict
